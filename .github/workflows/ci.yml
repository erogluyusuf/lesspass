name: Zero-Knowledge Vault CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-core:
    name: Core Crypto Engine (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and test core crypto engine
        run: |
          yarn --cwd packages/lesspass build
          yarn --cwd packages/lesspass test

  test-backend:
    name: Zero-Knowledge Relay API (Django)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Django API tests
        run: python backend/manage.py test api.tests.test_pairing

  test-mobile:
    name: Mobile Biometric Vault (React Native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build core and run mobile biometric tests
        run: |
          yarn --cwd packages/lesspass build
          yarn --cwd packages/lesspass-mobile test
